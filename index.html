<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ice Shaker | Buford Roofing &amp; Construction Custom Bottles</title>
    <meta
      name="description"
      content="Put the Buford Roofing &amp; Construction brand on the insulated bottle from Shark Tank. Custom logo bottles, bulk orders, fast turnaround."
    />
    <meta name="theme-color" content="#0b2540" />

    <!-- ==================================================================
         SOCIAL SHARE PREVIEW
         The image URL is built from VITE_SITE_URL in .env. Leave that empty
         and it stays a path relative to the page, which works on GitHub
         Pages and on any domain. Set it to the final address with a
         trailing slash once that is known, for the widest scraper support.
         ================================================================== -->
    <meta property="og:image" content="%VITE_SITE_URL%og-image.jpg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ice Shaker" />
    <meta
      property="og:title"
      content="Buford Roofing &amp; Construction | Your Logo. The Ultimate Bottle."
    />
    <meta
      property="og:description"
      content="Put the Buford brand on the insulated bottle from Shark Tank. Built for your customers, your crew, and your community."
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Three Ice Shaker bottles carrying the Buford Roofing and Construction logo, on a wall in front of a home."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Buford Roofing &amp; Construction | Your Logo. The Ultimate Bottle."
    />
    <meta
      name="twitter:description"
      content="Put the Buford brand on the insulated bottle from Shark Tank. Built for your customers, your crew, and your community."

    <link

    />
